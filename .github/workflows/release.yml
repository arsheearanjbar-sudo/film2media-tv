# Release — build film2media-tv.wgt in CI and publish it as a GitHub Release asset.
#
# How to use: open the repo's Actions tab → "Release" → "Run workflow" →
# enter a tag like v1.0.0 → the release is created with the assets attached.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build .wgt
        run: bash ./build.sh

      - name: Build versioned source zip
        run: |
          TAG="${{ inputs.tag }}"
          VER="${TAG#v}"
          ICON_ARG=""
          [ -f icon.png ] && ICON_ARG="icon.png"
          zip -qr "film2media-tv-${VER}.zip" config.xml index.html $ICON_ARG css js README.md README-FA.md build.sh -x '*/.*'

      - name: Create GitHub Release
        run: |
          TAG="${{ inputs.tag }}"
          VER="${TAG#v}"
          gh release create "$TAG" \
            --title "Film2Media TV $TAG" \
            --notes "Unofficial Samsung Tizen TV app for Film2Media (nilfgaard.top).

          **Install:** download film2media-tv-${VER}.zip, unzip, then sign it with your own Samsung certificate and install — the steps are in README-FA.md. The zip is unsigned and has no key: Samsung TVs only take apps signed for that TV.

          film2media-tv.wgt is the pre-packaged widget (also unsigned): sign it with your certificate (tizen package -s <profile>) and install." \
            film2media-tv.wgt "film2media-tv-${VER}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
